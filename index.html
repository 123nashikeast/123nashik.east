<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>१२३ नाशिक पूर्व विधानसभा मतदार संघ</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, "Noto Sans Devanagari", sans-serif;
            background: #f5f7fa;
            color: #222;
        }

        header {
            background: #1d4ed8;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        nav {
            background: white;
            padding: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        nav a {
            text-decoration: none;
            color: #1d4ed8;
            font-weight: bold;
            margin: 0 15px;
        }

        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .card {
            background: white;
            margin-bottom: 20px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #1d4ed8;
            margin-top: 0;
        }

        .button {
            display: block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 15px;
            margin: 12px 0;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
        }

        .button:hover {
            background: #1e40af;
        }

        .green {
            background: #15803d;
        }

        .green:hover {
            background: #166534;
        }

        footer {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 21px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>१२३ नाशिक पूर्व विधानसभा मतदार संघ</h1>
</header>

<nav>
    <a href="#home">Home</a>
</nav>

<div class="container">

    <div class="card" id="home">
        <h2>मतदार सेवा</h2>

        <a href="#" class="button">
            Search Your Name in Last SIR
        </a>

        <a href="#" class="button">
            Search Your Name in Voter List
        </a>
    </div>

    <div class="card">
        <h2>नाशिक महानगरपालिका नाशिक</h2>

        <a href="#" class="button">
            Month wise list of Addition, Deletion &amp; Updation
        </a>

        <a href="https://drive.google.com/drive/folders/1GVSxP5QN3l-t3QMEKmaAtGk5Wo4RgV54?usp=sharing"
           target="_blank"
           class="button green">
            Uncollectable ASDD List
        </a>
    </div>

</div>

<footer>
    <p>१२३ नाशिक पूर्व विधानसभा मतदार संघ</p>
</footer>

</body>
</html>
