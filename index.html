<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>123 Nashik East AC, Nashik</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Noto Sans Devanagari", sans-serif;
            background: #f5f5f5;
        }

        /* =========================
           TOP PURPLE BAR
        ========================= */
        .top-bar {
            height: 28px;
            background: #5140b8;
            color: white;

            display: flex;
            justify-content: flex-end;
            align-items: center;

            padding: 0 20px;
            font-size: 13px;
        }

        .top-bar span {
            margin-left: 12px;
            cursor: pointer;
        }


        /* =========================
           MAIN HEADER
        ========================= */
        .main-header {
            min-height: 85px;
            background: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 8px 30px;

            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }


        /* =========================
           LEFT SIDE
        ========================= */
        .header-left {
            display: flex;
            align-items: center;
        }


        /* LOGO */
        .logo-box {
            width: 65px;
            height: 65px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: white;

            overflow: hidden;
            margin-right: 15px;
        }

        .logo-box img {
            width: 100%;
            height: 100%;

            object-fit: contain;
        }


        /* TITLE */
        .site-title {
            border-left: 1px solid #d5d5d5;
            padding-left: 18px;
        }

        .site-title h1 {
            font-size: 22px;
            font-weight: 700;
            color: #333;

            margin-bottom: 4px;
        }

        .site-title p {
            font-size: 15px;
            color: #444;
        }


        /* =========================
           RIGHT SIDE
        ========================= */
        .constituency {
            text-align: right;
            line-height: 1.35;
        }

        .constituency .marathi {
            font-size: 20px;
            font-weight: 700;
            color: #333;
        }

        .constituency .district {
            font-size: 16px;
            font-weight: 600;
            color: #333;
        }

        .constituency .english {
            font-size: 14px;
            color: #555;

            margin-top: 3px;
        }


        /* =========================
           HOME BAR
        ========================= */
        .home-bar {
            height: 38px;

            background: white;

            display: flex;
            align-items: center;

            padding-left: 15px;

            border-bottom: 1px solid #ddd;
        }

        .home-button {
            background: #f1f1f1;

            border-radius: 15px;

            padding: 5px 15px;

            font-size: 13px;
            color: #333;
        }


        /* =========================
           MOBILE
        ========================= */
        @media (max-width: 700px) {

            .main-header {
                flex-direction: column;
                align-items: center;

                padding: 15px;
            }

            .header-left {
                width: 100%;
                justify-content: center;
            }

            .site-title h1 {
                font-size: 18px;
            }

            .site-title p {
                font-size: 13px;
            }

            .constituency {
                text-align: center;
                margin-top: 15px;
            }

            .constituency .marathi {
                font-size: 18px;
            }

            .constituency .district {
                font-size: 14px;
            }

            .constituency .english {
                font-size: 12px;
            }

            .top-bar {
                font-size: 11px;
                padding-right: 10px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================
         TOP BAR
    ========================= -->

    <div class="top-bar">

        <span>⌂</span>
        <span>|</span>
        <span>A</span>
        <span>A</span>
        <span>A−</span>
        <span>|</span>
        <span>A</span>
        <span>A</span>
        <span>A+</span>

    </div>



    <!-- =========================
         MAIN HEADER
    ========================= -->

    <header class="main-header">


        <!-- LEFT -->

        <div class="header-left">


            <!-- LOGO -->

            <div class="logo-box">

                <img
                    src="244-2446463_gandhinagar-election-commission-of-india.png"
                    alt="Election Commission of India Logo"
                >

            </div>



            <!-- TITLE -->

            <div class="site-title">

                <h1>
                    १२३ नाशिक पूर्व
                </h1>

                <p>
                    विधानसभा मतदार संघ, नाशिक
                </p>

            </div>


        </div>



        <!-- RIGHT -->

        <div class="constituency">

            <div class="english">
                <h1>
                123 Nashik East
                </h1>
                <p>
                Assembly Constituency, Nashik
                </p>
            </div>

        </div>


    </header>



    <!-- =========================
         HOME
    ========================= -->

    <div class="home-bar">

        <div class="home-button">
            🏠 &nbsp; Home
        </div>

    </div>



</body>
</html>

<a href="index.html" class="logo-box">
    <img
        src="244-2446463_gandhinagar-election-commission-of-india.png"
        alt="Election Commission of India Logo"
    >
</a>
