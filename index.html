<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>123 Nashik East AC</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Noto Sans Devanagari", sans-serif;
            background: #f5f5f5;
        }

        /* Top Purple Bar */
        .top-bar {
            height: 28px;
            background: #4f3bb7;
            color: white;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 18px;
            font-size: 13px;
        }

        /* Main Header */
        .main-header {
            height: 85px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            border-bottom: 1px solid #ddd;
            box-shadow: 0 2px 5px rgba(0,0,0,0.08);
        }

        /* Left Section */
        .header-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .logo-box {
            width: 55px;
            height: 55px;
            border: 2px solid #555;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: #fafafa;
        }

        .site-title {
            border-left: 1px solid #ccc;
            padding-left: 18px;
        }

        .site-title h1 {
            font-size: 20px;
            color: #333;
            font-weight: 700;
        }

        .site-title p {
            font-size: 13px;
            color: #666;
            margin-top: 4px;
        }

        /* Right Section */
        .constituency {
            text-align: right;
            line-height: 1.4;
        }

        .constituency .marathi {
            font-size: 22px;
            font-weight: bold;
            color: #333;
        }

        .constituency .district {
            font-size: 17px;
            font-weight: 600;
            color: #333;
        }

        .constituency .english {
            font-size: 14px;
            color: #555;
            margin-top: 5px;
        }

        /* Home Bar */
        .home-bar {
            height: 38px;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding-left: 18px;
        }

        .home-button {
            background: #f1f1f1;
            border-radius: 15px;
            padding: 5px 15px;
            font-size: 13px;
            color: #333;
        }

        /* Mobile */
        @media (max-width: 700px) {

            .main-header {
                height: auto;
                padding: 15px;
                flex-direction: column;
                gap: 15px;
            }

            .header-left {
                width: 100%;
                justify-content: center;
            }

            .constituency {
                text-align: center;
            }

            .constituency .marathi {
                font-size: 20px;
            }

            .constituency .district {
                font-size: 16px;
            }

            .top-bar {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <!-- Top Purple Bar -->
    <div class="top-bar">
        ⌂ &nbsp; | &nbsp; A&nbsp; A&nbsp; A− &nbsp; | &nbsp; A&nbsp; A&nbsp; A+
    </div>

    <!-- Main Header -->
    <header class="main-header">

        <!-- Left -->
        <div class="header-left">

            <div class="logo-box">
                 <img src="244-2446463_gandhinagar-election-commission-of-india.png"
                        alt="Election Commission of India">
            </div>

            <div class="site-title">
                <h1>१२३ नाशिक पूर्व</h1>
                <p>विधानसभा मतदार संघ, नाशिक</p>
            </div>

        </div>

        <!-- Right -->
        <div class="constituency">

            <div class="english">
                <h1>123 Nashik East</h1>
                <p>Assembly Constituency, Nashik<p>
            </div>

        </div>

    </header>

    <!-- Home -->
    <div class="home-bar">
        <div class="home-button">
            🏠 &nbsp; Home
        </div>
    </div>

</body>
</html>
